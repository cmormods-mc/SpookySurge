plugins {
    id 'fabric-loom'
}

base {
    archivesName = 'BossBarSkinsTestMod'
}

dependencies {
    minecraft 'com.mojang:minecraft:1.21.1'
    mappings loom.officialMojangMappings()
    modImplementation 'net.fabricmc:fabric-loader:0.17.2'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.116.6+1.21.1'
    modCompileOnly 'eu.pb4:polymer-resource-pack:0.9.19+1.21.1'
    modCompileOnly 'eu.pb4:polymer-common:0.9.19+1.21.1'
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

processResources {
    def modVersion = project.version
    inputs.property 'version', modVersion
    filesMatching('fabric.mod.json') { expand version: modVersion }
}
